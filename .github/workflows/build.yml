name: "Build & Cache"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: victus
            attr: .#nixosConfigurations.victus.config.system.build.toplevel
          - name: iso
            attr: .#nixosConfigurations.iso.config.system.build.toplevel
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: cachix/cachix-action@v17
        with:
          name: ar175-lol-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.target.name }}
        run: nix build "${{ matrix.target.attr }}" --fallback
