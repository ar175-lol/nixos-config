name: "check code"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/**'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: nix flake check
        run: nix flake check --show-trace --fallback --no-build

      - name: dry build
        run: nix build .#nixosConfigurations.victus.config.system.build.toplevel --dry-run
