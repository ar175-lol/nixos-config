name: "Check code"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/**'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: cachix/cachix-action@v14
        with:
          name: ar175-lol-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: nix flake check
        run: nix flake check --show-trace --fallback

      - name: Build victus
        run: nix build .#nixosConfigurations.victus.config.system.build.toplevel --fallback

      - name: Build iso
        run: nix build .#nixosConfigurations.iso.config.system.build.toplevel --fallback
