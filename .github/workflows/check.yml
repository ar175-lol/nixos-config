name: "Check code"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      
      - name: Check flake
        run: nix flake check
        
      - name: Verify system build
        run: nix build .#nixosConfigurations.victus.config.system.build.toplevel
