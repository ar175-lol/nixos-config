name: "Update Nix Flake Inputs"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  nix-flake-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/update-flake-lock@main
        id: update_flake
        with:
          token: ${{ secrets.GH_TOKEN }}
          pr-title: "chore(deps): update nix flake inputs"
          pr-labels: |
            dependencies
            automated

      - name: Enable auto-merge
        if: ${{ steps.update_flake.outputs.pull-request-number }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          pull-request-number: ${{ steps.update_flake.outputs.pull-request-number }}
          merge-method: squash
