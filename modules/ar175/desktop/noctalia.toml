config_version = 13

[bar.default]
center = [ "workspaces", "audio_visualizer", "widget" ]
end = [ "keyboard_layout", "battery", "volume", "control-center" ]
font_family = "JetBrainsMono NF"
font_weight = 700
margin_edge = 0
margin_ends = 0
position = "left"
radius = 10
radius_bottom_left = 0
radius_top_left = 0
scale = 1.5000000149011612
start = [ "launcher", "date", "group:g1" ]
thickness = 40

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "sysmon_2", "temp", "ram" ]
    opacity = 1.0
    padding = 6.0
    radius = 16.0

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[dock]
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 550.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 96.0
    box_width = 784.0
    cx = 960.0
    cy = 308.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

[nightlight]
enabled = true
force = true
temperature_day = 5000
temperature_night = 5000

[notification]
history_retention_hours = 2

[osd]
position = "top_right"
position_vertical = "top_right"

    [osd.kinds]
    keyboard_layout = false
    media = false
    power_profile = false
    privacy = false

[plugin_settings."thepunkoff/pomodoro"]
auto-start-breaks = true
auto-start-work = true
long-break-duration = 1
short-break-duration = 1
work-duration = 19

[plugins]
enabled = []

[shell]
font_family = "JetBrainsMono NF SemiBold"
password_style = "random"

    [shell.animation]
    speed = 0.5000000074505806

    [shell.launcher]
    show_app_origin_indicator = false

        [shell.launcher.providers.calculator]
        global = true
        prefix = ">calc"

        [shell.launcher.providers.emoji]
        prefix = ">emoji"

    [shell.panel]
    control_center_placement = "floating"
    floating_offset = 7
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.session]
    show_shortcuts = false

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/ar175/nixos-config/modules/ar175/assets"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ar175/nixos-config/modules/ar175/assets/wall4.png"

    [wallpaper.last]
    path = "/home/ar175/nixos-config/modules/ar175/assets/wall4.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/ar175/nixos-config/modules/ar175/assets/wall4.png"

    [[wallpaper.favorite]]
    builtin_palette = "Catppuccin"
    palette_source = "builtin"
    path = "/home/ar175/nixos-config/modules/ar175/assets/wall4.png"
    theme_mode = "dark"

[widget.battery]
capsule = true
display_mode = "graphic"
scale = 0.80000000000000004
show_label = false

[widget.control-center]
capsule = true
glyph = "user"
scale = 0.80000000000000004

[widget.date]
capsule = true
font_family = "JetBrainsMono NF"
font_weight = 700
scale = 0.65000000000000002
vertical_format = "{:%H}\\n{:%M}\\n-\\n{:%d}\\n{:%m}"

[widget.keyboard_layout]
capsule = true
capsule_radius = "auto"
font_weight = 700
scale = 0.80000000000000004

[widget.ram]
scale = 0.80000000000000004
show_value = false

[widget.sysmon_2]
scale = 0.80000000000000004
show_value = false
type = "sysmon"

[widget.temp]
scale = 0.75
show_value = false

[widget.volume]
capsule = true
capsule_padding = 8
scale = 0.85000000000000009

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
active_pill_size = 2.0
capsule = true
capsule_radius = "auto"
font_weight = 700
labels_only_when_occupied = true
occupied_color = "tertiary"